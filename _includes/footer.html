{% include base_path %}

<div class="page__footer-inner">
  <div class="page__footer-colophon">
    <span>&copy; {{ site.time | date: '%Y' }} <a href="{{ base_path }}/">{{ site.name }}</a></span>
    <span class="page__footer-sep">·</span>
    <span>Powered by <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a></span>
  </div>

  <div class="page__footer-social">
    {% if site.author.github %}
      <a href="https://github.com/{{ site.author.github }}" title="GitHub" rel="me" class="social-link">
        <i class="fab fa-github"></i>
      </a>
    {% endif %}
    {% if site.author.linkedin %}
      <a href="https://linkedin.com/in/{{ site.author.linkedin }}" title="LinkedIn" rel="me" class="social-link">
        <i class="fab fa-linkedin"></i>
      </a>
    {% endif %}
    {% if site.author.email %}
      <a href="mailto:{{ site.author.email }}" title="Email" class="social-link">
        <i class="fas fa-envelope"></i>
      </a>
    {% endif %}
    <a href="{{ base_path }}/feed.xml" title="RSS Feed" class="social-link">
      <i class="fas fa-rss"></i>
    </a>
  </div>
</div>
